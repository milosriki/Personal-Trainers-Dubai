---
layout: default
---
<article class="page page--{{ page.page_type | default: 'generic' }}">
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.last_modified_at %}<p class="meta">Last updated: {{ page.last_modified_at | date: '%-d %B %Y' }}</p>{% endif %}
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  </header>

  {{ content }}

  {% include cta-block.html placement="page-end" %}
</article>
