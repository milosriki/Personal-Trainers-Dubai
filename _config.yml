defaults:
  - scope: { path: "", type: "pages" }
    values:
      layout: default
      robots: "index,follow"
  - scope: { path: "", type: "locations" }
    values:
      layout: page
      page_type: location
      robots: "index,follow"
  - scope: { path: "", type: "services" }
    values:
      layout: page
      page_type: service
      robots: "index,follow"
  - scope: { path: "", type: "guides" }
    values:
      layout: page
      page_type: guide
      robots: "index,follow"
  - scope: { path: "video_inventory.md" }
    values:
      robots: "noindex,follow"
  - scope: { path: "SOCIAL-LINKS.md" }
    values:
      robots: "noindex,follow"

exclude:
  - README.md
  - CITATION.cff
  - codemeta.json
  - feed.json
  - manifest.json
  - humans.txt
  - security.txt
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - _unused-sitemap.xml.bak
  - _private/
  - .gstack/
  - .code-graph/
  - .github/

plugins:
