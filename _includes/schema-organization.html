<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "@id": "{{ site.money_site }}/#organization",
  "name": "{{ site.brand.legal_name }}",
  "alternateName": "{{ site.brand.trading_name }}",
  "url": "{{ site.money_site }}",
  "logo": "{{ site.money_site }}/logo.png",
  "telephone": "{{ site.brand.phone }}",
  "email": "{{ site.brand.email }}",
  "foundingDate": "{{ site.proof.founding_year }}",
  "founder": {
    "@type": "Person",
    "@id": "{{ site.url }}/milos-vukovic/#person",
    "name": "Milos Vukovic"
  },
  "areaServed": [
    {"@type": "City", "name": "Dubai", "containedInPlace": {"@type": "Country", "name": "United Arab Emirates"}},
    {"@type": "City", "name": "Abu Dhabi", "containedInPlace": {"@type": "Country", "name": "United Arab Emirates"}}
  ],
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "{{ site.brand.address_locality }}",
    "addressRegion": "{{ site.brand.address_region }}",
    "addressCountry": "{{ site.brand.address_country }}"
  },
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
    "opens": "05:00",
    "closes": "22:00"
  }],
  "sameAs": [
    {% for link in site.social.links %}"{{ link }}"{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ],
  "knowsAbout": [
    "Personal Training",
    "Body Recomposition",
    "Mobile Personal Training Dubai",
    "Executive Fitness",
    "Postnatal Fitness",
    "Weight Loss Coaching"
  ]
}
</script>
