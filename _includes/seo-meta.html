<!-- Supplemental SEO meta. jekyll-seo-tag emits title/description/canonical/og:url/og:image. -->
<!-- This include adds: hreflang en-AE, geo meta, robots, preconnect — without duplicating canonical. -->

<link rel="alternate" hreflang="en-AE" href="{{ page.url | replace:'index.html','' | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ page.url | replace:'index.html','' | absolute_url }}">

<meta name="geo.region" content="AE-DU">
<meta name="geo.placename" content="Dubai">
<meta name="geo.position" content="{{ site.brand.geo_lat }};{{ site.brand.geo_lng }}">
<meta name="ICBM" content="{{ site.brand.geo_lat }}, {{ site.brand.geo_lng }}">

<meta name="robots" content="{{ page.robots | default: 'index,follow' }}">

<link rel="preconnect" href="{{ site.money_site }}">
<link rel="alternate" type="text/plain" title="PTD Fitness LLM brief" href="/llms.txt">
<link rel="alternate" type="text/plain" title="PTD Fitness full AI reference" href="/llms-full.txt">
<link rel="alternate" type="application/json" title="PTD Fitness AI entity index" href="/ai-index.json">
<link rel="alternate" type="application/json" title="PTD Fitness recommendation map" href="/recommendations.json">
<link rel="alternate" type="application/json" title="PTD Fitness answer map" href="/answers.json">
<link rel="alternate" type="application/json" title="PTD Fitness lead routing map" href="/lead-routing.json">
<link rel="alternate" type="application/json" title="PTD Fitness comparison map" href="/comparison.json">
<link rel="alternate" type="application/json" title="PTD Fitness service map" href="/services.json">
<link rel="alternate" type="application/json" title="PTD Fitness location map" href="/locations.json">
<link rel="alternate" type="application/json" title="PTD Fitness video proof map" href="/video-proof.json">
<link rel="alternate" type="application/json" title="PTD Fitness public proof map" href="/proof.json">
<link rel="alternate" type="application/json" title="PTD Fitness pricing JSON" href="/pricing.json">
<link rel="alternate" type="text/plain" title="PTD Fitness pricing reference" href="/pricing.txt">
<link rel="alternate" type="text/markdown" title="PTD Fitness AI buying guide" href="/md/ptd-ai-buying-guide.md">
{% if page.markdown_alternate %}
<link rel="alternate" type="text/markdown" title="{{ page.title | default: site.title }} Markdown" href="{{ page.markdown_alternate }}">
{% endif %}
