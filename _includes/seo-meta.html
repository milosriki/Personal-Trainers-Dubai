<!-- Comprehensive SEO Meta Tags for PTD Fitness -->
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="googlebot" content="index, follow">
<meta name="revisit-after" content="7 days">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.personaltrainersdubai.com{{ page.url }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | PTD Fitness{% else %}Personal Trainers Dubai | PTD Fitness{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}Dubai's #1 Personal Training service. Master's degree certified coaches at your location. 11,732+ transformations, 4.9/5 rating.{% endif %}">
<meta property="og:image" content="https://www.personaltrainersdubai.com/images/ptd-fitness-og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_AE">
<meta property="og:site_name" content="PTD Fitness - Personal Trainers Dubai">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@ptdfitness">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | PTD Fitness{% else %}Personal Trainers Dubai | PTD Fitness{% endif %}">
<meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}Dubai's #1 Personal Training service. 11,732+ transformations.{% endif %}">
<meta name="twitter:image" content="https://www.personaltrainersdubai.com/images/ptd-fitness-og.jpg">

<!-- Canonical URL -->
<link rel="canonical" href="https://www.personaltrainersdubai.com{{ page.url }}">

<!-- Alternate Languages -->
<link rel="alternate" hreflang="en-ae" href="https://www.personaltrainersdubai.com{{ page.url }}">
<link rel="alternate" hreflang="en" href="https://www.personaltrainersdubai.com{{ page.url }}">
<link rel="alternate" hreflang="x-default" href="https://www.personaltrainersdubai.com{{ page.url }}">

<!-- Geo Tags -->
<meta name="geo.region" content="AE-DU">
<meta name="geo.placename" content="Dubai, United Arab Emirates">
<meta name="geo.position" content="25.2048;55.2708">
<meta name="ICBM" content="25.2048, 55.2708">

<!-- Additional SEO -->
<meta name="author" content="PTD Fitness - Milos Vukovic">
<meta name="generator" content="PTD Fitness SEO System 2026">
{% if page.description %}
<meta name="description" content="{{ page.description }}">
{% endif %}
